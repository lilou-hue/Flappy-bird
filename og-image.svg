<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6fd8"/>
      <stop offset="100%" stop-color="#ffcc4d"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Starfield dots -->
    <radialGradient id="star" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle star dots -->
  <circle cx="100" cy="80" r="2" fill="white" opacity="0.4"/>
  <circle cx="350" cy="50" r="1.5" fill="white" opacity="0.3"/>
  <circle cx="800" cy="100" r="2" fill="white" opacity="0.5"/>
  <circle cx="1050" cy="60" r="1.5" fill="white" opacity="0.3"/>
  <circle cx="150" cy="550" r="1.5" fill="white" opacity="0.3"/>
  <circle cx="950" cy="520" r="2" fill="white" opacity="0.4"/>
  <circle cx="1100" cy="400" r="1.5" fill="white" opacity="0.3"/>
  <circle cx="70" cy="300" r="2" fill="white" opacity="0.35"/>
  <circle cx="500" cy="580" r="1.5" fill="white" opacity="0.25"/>
  <circle cx="700" cy="40" r="1" fill="white" opacity="0.4"/>

  <!-- Lightning bolt -->
  <g filter="url(#glow)" transform="translate(160, 120) scale(0.9)">
    <path d="M290 80 L200 250 L270 250 L222 432 L340 220 L265 220 Z" fill="url(#accent)"/>
  </g>

  <!-- SLAYPLAY text -->
  <text x="680" y="270" text-anchor="middle" font-family="'Trebuchet MS', Impact, sans-serif" font-weight="900" font-size="130" letter-spacing="8" fill="#ffffff" filter="url(#glow)">SLAY</text>
  <text x="680" y="400" text-anchor="middle" font-family="'Trebuchet MS', Impact, sans-serif" font-weight="900" font-size="130" letter-spacing="8" fill="url(#accent)">PLAY</text>

  <!-- Tagline -->
  <text x="680" y="480" text-anchor="middle" font-family="'Trebuchet MS', sans-serif" font-weight="400" font-size="32" letter-spacing="4" fill="#ffffff" opacity="0.7">20+ FREE ARCADE GAMES IN YOUR BROWSER</text>

  <!-- URL -->
  <text x="680" y="560" text-anchor="middle" font-family="'Trebuchet MS', sans-serif" font-weight="600" font-size="26" letter-spacing="3" fill="url(#accent)" opacity="0.8">slayplay.io</text>
</svg>
