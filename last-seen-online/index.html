<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Last Seen Online</title>
  <link rel="stylesheet" href="styles.css">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-VMLC97VBGN"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-VMLC97VBGN');
  </script>
</head>
<body>
  <a href="/" class="back-link">&larr; Back</a>
  <div id="phone-container">
    <div id="phone">
      <div id="phone-bezel">
        <div id="phone-notch"></div>
        <div id="phone-screen">
          <!-- Lock Screen -->
          <div class="screen active" id="lockScreen">
            <div class="lock-time" id="lockTime">9:41</div>
            <div class="lock-date" id="lockDate">Monday, March 17</div>
            <div class="lock-notifications" id="lockNotifications"></div>
            <div class="lock-swipe">
              <div class="swipe-indicator"></div>
              <span>swipe up to unlock</span>
            </div>
          </div>

          <!-- Home Screen (Contact List) -->
          <div class="screen" id="homeScreen">
            <div class="home-header">
              <div class="status-bar">
                <span class="status-time">9:41</span>
                <span class="status-icons">&#x2630; &#x1F50B;</span>
              </div>
              <h1 class="home-title">Messages</h1>
            </div>
            <div class="contact-list" id="contactList"></div>
          </div>

          <!-- Chat View -->
          <div class="screen" id="chatScreen">
            <div class="chat-header" id="chatHeader">
              <button class="chat-back" id="chatBack">&larr;</button>
              <div class="chat-header-info">
                <div class="chat-avatar" id="chatAvatar"></div>
                <div>
                  <div class="chat-name" id="chatName"></div>
                  <div class="chat-last-seen" id="chatLastSeen"></div>
                </div>
              </div>
            </div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-fake">
              <span>iMessage</span>
            </div>
          </div>

          <!-- Notes Screen -->
          <div class="screen" id="notesScreen">
            <div class="notes-header">
              <button class="chat-back" id="notesBack">&larr;</button>
              <h2>Notes</h2>
            </div>
            <div class="notes-list" id="notesList"></div>
          </div>

          <!-- Note Detail -->
          <div class="screen" id="noteDetail">
            <div class="notes-header">
              <button class="chat-back" id="noteDetailBack">&larr;</button>
              <h2 id="noteDetailTitle"></h2>
            </div>
            <div class="note-content" id="noteDetailContent"></div>
          </div>

          <!-- Choice Overlay -->
          <div class="choice-overlay" id="choiceOverlay">
            <div class="choice-prompt" id="choicePrompt"></div>
            <div class="choice-options" id="choiceOptions"></div>
          </div>

          <!-- Ending Screen -->
          <div class="screen" id="endingScreen">
            <div class="ending-lock">
              <div class="lock-time">9:41</div>
              <div class="lock-date">Monday, March 17</div>
              <div class="ending-notification" id="endingNotification">
                <div class="notif-icon">📞</div>
                <div class="notif-text">
                  <strong>1 Missed Call</strong>
                  <span>Jordan</span>
                </div>
              </div>
            </div>
            <div class="ending-fade" id="endingFade">
              <h1 class="ending-title">Last Seen Online</h1>
              <p class="ending-subtitle" id="endingSubtitle">Check in on someone today.</p>
              <div class="ending-score" id="endingScore"></div>
              <button class="ending-btn" id="endingBtn">Back to Arcade</button>
            </div>
          </div>

          <!-- Thought Bubble -->
          <div class="thought-bubble" id="thoughtBubble">
            <div class="thought-text" id="thoughtText"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="leaderboardPanel"></div>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <link rel="stylesheet" href="../leaderboard.css">
  <link rel="stylesheet" href="../arcade.css">
  <script src="../arcade.js"></script>
  <script src="../leaderboard.js"></script>
  <script src="audio.js"></script>
  <script src="game.js"></script>
  <script>if(typeof Arcade!=='undefined')Arcade.injectNavHUD();</script>
</body>
</html>
