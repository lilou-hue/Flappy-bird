<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VMLC97VBGN"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-VMLC97VBGN');
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Rivals — SlayPlay</title>
  <meta property="og:site_name" content="SlayPlay">
  <meta property="og:title" content="Rivals">
  <meta property="og:description" content="Head-to-head arcade competition. Beat your rivals to claim the top spot.">
  <meta property="og:type" content="website">
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="../shop.css" />
  </head>
  <body>
    <main class="game" id="gameContainer">
      <header class="game__header">
        <a href="/" class="back-link" data-i18n="backToGames">&larr; Back to Games</a>
        <h1 data-i18n="rvTitle">Rivals</h1>
        <p data-i18n="rvInstructions">WASD move &bull; F shoot &bull; R switch &bull; G utility &bull; Shift dash</p>
      </header>
      <section class="game__panel">
        <canvas id="gameCanvas" width="360" height="640" aria-label="Rivals"></canvas>
        <div class="game__hud">
          <div class="hud__score">
            <span data-i18n="score">Score</span>
            <strong id="score">0</strong>
          </div>
          <div class="hud__score">
            <span data-i18n="best">Best</span>
            <strong id="bestScore">0</strong>
          </div>
          <button id="restartButton" class="hud__button" type="button" data-i18n="restart">Restart</button>
          <button id="muteBtn" class="hud__mute" type="button" aria-label="Toggle sound">🔊</button>
          <button id="fullscreenButton" class="hud__mute" type="button" aria-label="Toggle fullscreen" data-i18n-aria="fullscreen">&#x26F6;</button>
          <button id="leaderboardToggle" class="lb-toggle-btn" type="button" aria-label="Toggle leaderboard">&#x1F3C6;</button>
          <button id="shopBtn" class="hud__button" type="button">Shop</button>
        </div>
      </section>
      <footer class="game__footer">
        <p data-i18n="rvTip">Tip: Buy weapons wisely — save credits for rifles and snipers in later rounds!</p>
      </footer>
      <!-- Achievements panel -->
      <div class="achievements-panel" id="achievementsPanel">
        <button class="achievements-toggle" id="achievementsToggle" type="button" data-i18n="achievements">Achievements</button>
        <div class="achievements-list" id="achievementsList"></div>
      </div>
    </main>
    <!-- Achievement popup -->
    <div class="achievement-popup" id="achievementPopup">
      <div class="achievement-popup__icon" id="achievementPopupIcon"></div>
      <div class="achievement-popup__text">
        <strong id="achievementPopupTitle"></strong>
        <span id="achievementPopupDesc"></span>
      </div>
    </div>
    <div id="leaderboardPanel"></div>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <!-- Platform CSS -->
    <link rel="stylesheet" href="../leaderboard.css">
    <link rel="stylesheet" href="../arcade.css">
    <!-- Platform JS -->
    <script src="../arcade.js"></script>
    <script src="../leaderboard.js"></script>
    <script src="../i18n.js"></script>
    <script src="audio.js"></script>
    <script src="../shop.js"></script>
    <script src="game.js"></script>
    <script>if(typeof Arcade!=='undefined')Arcade.injectNavHUD();</script>
  </body>
</html>
