<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life in Weeks — SlayPlay</title>
  <meta property="og:site_name" content="SlayPlay">
  <meta property="og:title" content="Life in Weeks">
  <meta property="og:description" content="Visualize your entire life as a grid of weeks. A meditative experience.">
  <meta property="og:type" content="website">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VMLC97VBGN"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-VMLC97VBGN');
    </script>
</head>
<body>
    <a href="/" class="back-link" data-i18n="liwBack">&larr; Back</a>

    <div class="container">
        <header class="header">
            <h1 class="title" data-i18n="liwTitle">Life in Weeks</h1>
            <p class="subtitle" data-i18n="liwSubtitle">Your life in the context of history.</p>
        </header>

        <div class="input-section" id="inputSection">
            <label class="input-label" data-i18n="liwEnterBirthday">Enter your birthday</label>
            <div class="date-selects">
                <select id="birthMonth" class="date-select">
                    <option value="" disabled selected>Month</option>
                </select>
                <select id="birthDay" class="date-select">
                    <option value="" disabled selected>Day</option>
                </select>
                <select id="birthYear" class="date-select">
                    <option value="" disabled selected>Year</option>
                </select>
                <button id="goBtn" class="go-btn" data-i18n="liwGo">Go</button>
            </div>
        </div>

        <div class="grid-wrapper">
            <div class="column-label" data-i18n="liwWeeks">Weeks &rarr;</div>
            <div class="grid-container">
                <div class="age-labels" id="ageLabels"></div>
                <div class="grid" id="grid"></div>
            </div>
        </div>

        <div class="stats" id="stats"></div>
    </div>

    <div class="tooltip" id="tooltip"></div>

    <script src="../i18n.js"></script>
    <script src="game.js"></script>
</body>
</html>
