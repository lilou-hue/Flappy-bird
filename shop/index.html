<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-VMLC97VBGN"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-VMLC97VBGN');

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop — SlayPlay</title>
  <meta property="og:site_name" content="SlayPlay">
  <meta property="og:title" content="Shop">
  <meta property="og:description" content="Spend your coins on cosmetics, badges, and power-ups in the SlayPlay shop.">
  <meta property="og:type" content="website">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../arcade.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');
  </style>
</head>
<body class="arc-page">
  <script src="../arcade.js"></script>
  <script src="../i18n.js"></script>

  <div class="arc-page__container">
    <h1 class="arc-page__title">Arcade Shop</h1>
    <p class="arc-page__subtitle">Spend your hard-earned coins on badges, titles, powers, and more</p>

    <div class="arc-coin-header">
      <div class="arc-coin-header__balance">
        <span>&#x1FA99;</span> <span class="arc-coin-value">0</span> coins
      </div>
    </div>

    <div class="arc-equipped" id="equippedDisplay"></div>

    <!-- Active powers bar -->
    <div class="arc-active-powers" id="activePowers" style="display:none"></div>

    <div class="arc-tabs" id="shopTabs">
      <button class="arc-tab arc-tab--active" data-cat="badge">Badges</button>
      <button class="arc-tab" data-cat="theme">Themes</button>
      <button class="arc-tab" data-cat="frame">Frames</button>
      <button class="arc-tab" data-cat="title">Titles</button>
      <button class="arc-tab" data-cat="power">Powers</button>
    </div>

    <div class="arc-shop-grid" id="shopGrid"></div>
  </div>

  <script>
    (function () {
      var currentCat = 'badge';
      var RARITY_LABELS = { common: 'Common', uncommon: 'Uncommon', rare: 'Rare', epic: 'Epic', legendary: 'Legendary' };

      Arcade.injectNavHUD();

      function renderActivePowers() {
        var bar = document.getElementById('activePowers');
        var status = Arcade.getActiveShopPowerStatus();
        var parts = [];
        if (status.coinx2) parts.push('💰 2× Coins — ' + status.coinx2 + 'm left');
        if (status.magnet) parts.push('🧲 Magnet — ' + status.magnet + 'm left');
        if (status.lucky)  parts.push('🌟 Lucky Star — next game');
        var shield = Arcade.getShopItems().find(function(i) { return i.id === 'streak_shield'; });
        if (shield && shield.powerActive) parts.push('🛡️ Streak Shield — ready');
        if (parts.length) {
          bar.style.display = '';
          bar.innerHTML = '<div class="arc-active-powers__label">Active Powers:</div>' +
            parts.map(function(p) { return '<div class="arc-active-powers__pill">' + p + '</div>'; }).join('');
        } else {
          bar.style.display = 'none';
        }
      }

      function renderEquipped() {
        var data = Arcade.getProfileData();
        var el = document.getElementById('equippedDisplay');
        var items = Arcade.getShopItems();
        var slots = ['badge', 'theme', 'frame', 'title'];
        el.innerHTML = slots.map(function (cat) {
          var eqId = data['equipped' + cat.charAt(0).toUpperCase() + cat.slice(1)];
          var item = eqId ? items.find(function (i) { return i.id === eqId; }) : null;
          return '<div class="arc-equipped__slot' + (item ? ' arc-equipped__slot--filled' : '') + '">' +
            '<div class="arc-equipped__label">' + cat + '</div>' +
            '<div class="arc-equipped__icon">' + (item ? item.icon : '-') + '</div>' +
            (item && item.label ? '<div class="arc-equipped__sublabel">' + item.label + '</div>' : '') +
          '</div>';
        }).join('');
      }

      function renderShop() {
        var grid = document.getElementById('shopGrid');
        var allItems = Arcade.getShopItems();
        var items = allItems.filter(function (i) { return i.cat === currentCat; });
        var coins = Arcade.getCoins();
        var admin = Arcade.isAdminMode();

        if (!items.length) {
          grid.innerHTML = '<div style="color:rgba(255,255,255,0.4);padding:2rem;text-align:center">No items found.</div>';
          return;
        }

        grid.innerHTML = items.map(function (item) {
          var rarityClass = item.rarity ? ' arc-shop-item--' + item.rarity : '';
          var btnClass = 'arc-shop-btn';
          var btnText = '';
          var btnDisabled = '';
          var isPower = item.cat === 'power';

          if (isPower) {
            if (item.powerActive) {
              btnClass += ' arc-shop-btn--active';
              btnText = '✅ ' + item.powerActive;
            }
            if (admin) {
              btnText = btnText || 'Activate Free';
            } else {
              if (!btnText) btnText = '⚡ ' + item.cost + ' coins';
              if (coins < item.cost && !item.powerActive) btnDisabled = ' disabled';
            }
          } else if (item.requireAch) {
            btnClass += ' arc-shop-btn--locked';
            btnText = '🔒 Achievement only';
            btnDisabled = ' disabled';
          } else if (item.equipped) {
            btnClass += ' arc-shop-btn--equipped';
            btnText = '✓ Equipped';
          } else if (item.purchased) {
            btnClass += ' arc-shop-btn--owned';
            btnText = item.cat === 'title' ? 'Equip Title' : 'Equip';
          } else {
            btnText = admin ? 'Unlock Free' : item.cost + ' coins';
            if (!admin && coins < item.cost) btnDisabled = ' disabled';
          }

          return '<div class="arc-shop-item' + rarityClass + '" data-id="' + item.id + '">' +
            (item.rarity ? '<div class="arc-shop-item__rarity">' + (RARITY_LABELS[item.rarity] || item.rarity) + '</div>' : '') +
            '<div class="arc-shop-item__icon arc-shop-item__icon--' + (item.rarity || 'common') + '">' + item.icon + '</div>' +
            '<div class="arc-shop-item__name">' + (item.name || item.displayName || item.id) + '</div>' +
            (item.label ? '<div class="arc-shop-item__label">"' + item.label + '"</div>' : '') +
            (item.desc ? '<div class="arc-shop-item__desc">' + item.desc + '</div>' : '') +
            '<div class="arc-shop-item__cost">' +
              (item.requireAch ? '🔒 Achievement' : (item.cost === 0 ? 'Free' : '&#x1FA99; ' + item.cost)) +
            '</div>' +
            '<button class="' + btnClass + '"' + btnDisabled + '>' + btnText + '</button>' +
          '</div>';
        }).join('');

        grid.querySelectorAll('.arc-shop-item').forEach(function (card) {
          card.querySelector('button').addEventListener('click', function () {
            var id = card.dataset.id;
            var item = Arcade.getShopItems().find(function (i) { return i.id === id; });
            if (!item) return;

            if (item.cat === 'power') {
              var r = Arcade.purchaseItem(id);
              if (!r.success) { showToast('❌ ' + (r.reason || 'Cannot activate')); return; }
              var msgs = {
                coinx2_1h:    '💰 Coin Rush activated! 2× coins for 1 hour.',
                lucky_next:   '🌟 Lucky Star ready! Guaranteed drop next game.',
                magnet_24h:   '🧲 Coin Magnet on! +10 coins per game for 24h.',
                streak_shield:'🛡️ Streak Shield equipped!'
              };
              showToast(msgs[item.effect] || '⚡ Power activated!');
            } else if (item.purchased) {
              Arcade.equipItem(id);
              showToast('✓ ' + (item.name || item.displayName) + ' equipped!');
            } else {
              var r = Arcade.purchaseItem(id);
              if (!r.success) { showToast('❌ ' + (r.reason || 'Cannot buy')); return; }
              Arcade.equipItem(id);
              showToast('✅ ' + (item.name || item.displayName) + ' unlocked & equipped!');
            }
            renderShop();
            renderEquipped();
            renderActivePowers();
          });
        });
      }

      function showToast(msg) {
        var t = document.createElement('div');
        t.className = 'arc-shop-toast';
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(function() { t.classList.add('arc-shop-toast--visible'); }, 30);
        setTimeout(function() {
          t.classList.remove('arc-shop-toast--visible');
          setTimeout(function() { t.remove(); }, 400);
        }, 2800);
      }

      document.getElementById('shopTabs').addEventListener('click', function (e) {
        if (!e.target.dataset.cat) return;
        currentCat = e.target.dataset.cat;
        document.querySelectorAll('.arc-tab').forEach(function (t) { t.classList.remove('arc-tab--active'); });
        e.target.classList.add('arc-tab--active');
        renderShop();
      });

      renderEquipped();
      renderShop();
      renderActivePowers();
    })();
  </script>
</body>
</html>
