<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-VMLC97VBGN"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-VMLC97VBGN');

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaderboard — SlayPlay</title>
  <meta property="og:site_name" content="SlayPlay">
  <meta property="og:title" content="Leaderboard">
  <meta property="og:description" content="Top scores across all SlayPlay games. Compete globally.">
  <meta property="og:type" content="website">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../arcade.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');
    .arc-lb-wrap {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 1rem;
      overflow-x: auto;
    }
    .arc-lb-game-section { margin-bottom: 1.5rem; }
    .arc-lb-game-section h3 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1rem;
      color: rgba(255,255,255,0.7);
      margin: 0 0 0.5rem;
      padding-left: 0.25rem;
    }
    .arc-lb-loading {
      text-align: center;
      color: rgba(255,255,255,0.4);
      padding: 2rem 0;
      font-family: 'Space Grotesk', sans-serif;
    }
  </style>
</head>
<body class="arc-page">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="../arcade.js"></script>
  <script src="../leaderboard.js"></script>
  <script src="../i18n.js"></script>

  <div class="arc-page__container">
    <h1 class="arc-page__title" data-i18n="lbPageTitle">Leaderboard</h1>
    <p class="arc-page__subtitle" data-i18n="lbPageSubtitle">See how you stack up</p>

    <div class="arc-tabs" id="lbTabs">
      <button class="arc-tab arc-tab--active" data-tab="all" data-i18n="lbOverallRanking">Overall Ranking</button>
      <button class="arc-tab" data-tab="flappy-bird">Flappy Bird</button>
      <button class="arc-tab" data-tab="snake">Snake</button>
      <button class="arc-tab" data-tab="tetris">Tetris</button>
      <button class="arc-tab" data-tab="lumina">Lumina</button>
      <button class="arc-tab" data-tab="phantom-road">Phantom Road</button>
      <button class="arc-tab" data-tab="methane-drift">Methane Drift</button>
      <button class="arc-tab" data-tab="gun-game">Gun Game</button>
      <button class="arc-tab" data-tab="astro-miner">Astro Miner</button>
      <button class="arc-tab" data-tab="star-fury">Star Fury</button>
      <button class="arc-tab" data-tab="inkognito">Inkognito</button>
      <button class="arc-tab" data-tab="stack-tower">Stack Tower</button>
      <button class="arc-tab" data-tab="neon-pong">Neon Pong</button>
      <button class="arc-tab" data-tab="beat-drop">Beat Drop</button>
      <button class="arc-tab" data-tab="dress-up">Dress-Up</button>
      <button class="arc-tab" data-tab="unicorn-clicker">Unicorn Fart Clicker</button>
      <button class="arc-tab" data-tab="rivals">Rivals</button>
      <button class="arc-tab" data-tab="gravity-garden">Gravity Garden</button>
      <button class="arc-tab" data-tab="last-seen-online">Last Seen Online</button>
      <button class="arc-tab" data-tab="art-of-doing-nothing">The Art of Doing Nothing</button>
      <button class="arc-tab" data-tab="heart-serve">Heart Serve</button>
      <button class="arc-tab" data-tab="signal-lost">Signal Lost</button>
    </div>

    <div class="arc-lb-wrap" id="lbContent">
      <p class="arc-lb-loading">Loading scores…</p>
    </div>
  </div>

  <script>
    (function () {
      function t(key, fallback) {
        if (typeof I18N !== 'undefined' && I18N.t) { var v = I18N.t(key); if (v && v !== key) return v; }
        return fallback || key;
      }

      Arcade.injectNavHUD();

      if (typeof I18N !== 'undefined') {
        I18N.createSelector(document.querySelector('.arc-page__container'));
        I18N.applyDOM();
        window.addEventListener('langchange', function () { I18N.applyDOM(); render(); });
      }

      var currentTab = 'all';
      var localNickname = localStorage.getItem('arcade_nickname') || '';

      var GAME_NAMES = {
        'flappy-bird': 'Flappy Bird', 'snake': 'Snake', 'tetris': 'Tetris',
        'lumina': 'Lumina', 'phantom-road': 'Phantom Road', 'methane-drift': 'Methane Drift',
        'gun-game': 'Gun Game', 'astro-miner': 'Astro Miner', 'star-fury': 'Star Fury',
        'inkognito': 'Inkognito', 'stack-tower': 'Stack Tower', 'neon-pong': 'Neon Pong',
        'beat-drop': 'Beat Drop', 'dress-up': 'Dress-Up', 'unicorn-clicker': 'Unicorn Fart Clicker',
        'rivals': 'Rivals',
        'gravity-garden': 'Gravity Garden',
        'last-seen-online': 'Last Seen Online',
        'art-of-doing-nothing': 'The Art of Doing Nothing',
        'heart-serve': 'Heart Serve',
        'signal-lost': 'Signal Lost'
      };
      var GAME_IDS = Object.keys(GAME_NAMES);

      function escapeHtml(str) {
        var d = document.createElement('div');
        d.textContent = str;
        return d.innerHTML;
      }

      function buildTable(scores) {
        if (!scores.length) return '<p class="arc-lb-loading">' + t('noScoresYet', 'No scores yet.') + '</p>';
        var html = '<table class="arc-lb-table"><thead><tr>' +
          '<th class="arc-lb-rank">#</th><th>' + t('lbPlayer', 'Player') + '</th><th class="arc-lb-score">' + t('score', 'Score') + '</th>' +
          '</tr></thead><tbody>';
        scores.forEach(function (e, i) {
          var isMe = e.nickname === localNickname;
          var rankStr = i === 0 ? '\uD83D\uDC51 1' : String(i + 1);
          var cls = isMe ? ' class="arc-lb-me"' : '';
          html += '<tr' + cls + '>' +
            '<td class="arc-lb-rank">' + rankStr + '</td>' +
            '<td>' + escapeHtml(e.nickname) + (isMe ? ' ' + t('lbYou', '(you)') : '') + '</td>' +
            '<td class="arc-lb-score">' + e.score.toLocaleString() + '</td>' +
          '</tr>';
        });
        html += '</tbody></table>';
        return html;
      }

      function buildAvgTable(rows) {
        if (!rows.length) return '<p class="arc-lb-loading">' + t('lbNoScoresPlay', 'No scores yet. Play some games!') + '</p>';
        var html = '<table class="arc-lb-table"><thead><tr>' +
          '<th class="arc-lb-rank">#</th><th>' + t('lbPlayer', 'Player') + '</th>' +
          '<th class="arc-lb-score">' + t('lbAvgPosition', 'Avg Position') + '</th><th class="arc-lb-score">' + t('lbGamesCount', 'Games') + '</th>' +
          '</tr></thead><tbody>';
        rows.forEach(function (r, i) {
          var isMe = r.nickname === localNickname;
          var rankStr = i === 0 ? '\uD83D\uDC51 1' : String(i + 1);
          var cls = isMe ? ' class="arc-lb-me"' : '';
          html += '<tr' + cls + '>' +
            '<td class="arc-lb-rank">' + rankStr + '</td>' +
            '<td>' + escapeHtml(r.nickname) + (isMe ? ' ' + t('lbYou', '(you)') : '') + '</td>' +
            '<td class="arc-lb-score">' + r.avg.toFixed(1) + '</td>' +
            '<td class="arc-lb-score">' + r.gamesPlayed + '/' + GAME_IDS.length + '</td>' +
          '</tr>';
        });
        html += '</tbody></table>';
        return html;
      }

      function renderSingleGame(gameId) {
        var content = document.getElementById('lbContent');
        content.innerHTML = '<p class="arc-lb-loading">' + t('loadingScores', 'Loading scores…') + '</p>';
        Leaderboard.getTopScores(gameId).then(function (scores) {
          content.innerHTML = buildTable(scores);
        }).catch(function () {
          content.innerHTML = '<p class="arc-lb-loading">' + t('lbError', 'Could not load leaderboard.') + '</p>';
        });
      }

      function renderAllGames() {
        var content = document.getElementById('lbContent');
        content.innerHTML = '<p class="arc-lb-loading">' + t('loadingScores', 'Loading scores…') + '</p>';

        var promises = GAME_IDS.map(function (id) {
          return Leaderboard.getAllScores(id).then(function (scores) {
            return { id: id, scores: scores };
          }).catch(function () {
            return { id: id, scores: [] };
          });
        });

        Promise.all(promises).then(function (results) {
          // For each game, compute each player's best rank (deduped by nickname)
          // ranks maps nickname -> array of rank positions
          var ranks = {};

          results.forEach(function (r) {
            if (!r.scores.length) return;
            // Dedupe: keep best score per player, skip invalid entries
            var bestByPlayer = {};
            r.scores.forEach(function (entry) {
              if (!entry.nickname || typeof entry.score !== 'number') return;
              if (!bestByPlayer[entry.nickname] || entry.score > bestByPlayer[entry.nickname]) {
                bestByPlayer[entry.nickname] = entry.score;
              }
            });
            // Sort players by their best score descending
            var sorted = Object.keys(bestByPlayer).map(function (name) {
              return { nickname: name, score: bestByPlayer[name] };
            }).sort(function (a, b) { return b.score - a.score; });

            // Assign ranks (1-based)
            sorted.forEach(function (entry, idx) {
              if (!ranks[entry.nickname]) ranks[entry.nickname] = [];
              ranks[entry.nickname].push(idx + 1);
            });
          });

          // Compute average position per player
          var rows = Object.keys(ranks).map(function (name) {
            var positions = ranks[name];
            var sum = positions.reduce(function (a, b) { return a + b; }, 0);
            return {
              nickname: name,
              avg: sum / positions.length,
              gamesPlayed: positions.length
            };
          });

          // Only include players with at least 3 games for reliable ranking
          rows = rows.filter(function(r) { return r.gamesPlayed >= 3; });

          // Sort: lower average = better; tie-break by more games played
          rows.sort(function (a, b) {
            if (a.avg !== b.avg) return a.avg - b.avg;
            return b.gamesPlayed - a.gamesPlayed;
          });

          content.innerHTML = buildAvgTable(rows);
        }).catch(function () {
          content.innerHTML = '<p class="arc-lb-loading">' + t('lbError', 'Could not load leaderboard.') + '</p>';
        });
      }

      function render() {
        if (currentTab === 'all') {
          renderAllGames();
        } else {
          renderSingleGame(currentTab);
        }
      }

      document.getElementById('lbTabs').addEventListener('click', function (e) {
        if (!e.target.dataset.tab) return;
        currentTab = e.target.dataset.tab;
        document.querySelectorAll('.arc-tab').forEach(function (t) { t.classList.remove('arc-tab--active'); });
        e.target.classList.add('arc-tab--active');
        render();
      });

      render();
    })();
  </script>
</body>
</html>
