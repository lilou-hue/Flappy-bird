# GitHub Pages is set to build_type=legacy (deploys automatically from main branch).
# This workflow is intentionally disabled to avoid racing the built-in deployment.
# To re-enable Actions-based deployment, change Pages source to "GitHub Actions" in repo settings.
name: Deploy to GitHub Pages (disabled)

on:
  workflow_dispatch:  # manual trigger only — not on push

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Pages deploys automatically from main via legacy mode. This workflow is a no-op."
