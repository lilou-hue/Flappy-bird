<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VMLC97VBGN"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-VMLC97VBGN');
    </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dress-Up</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="../shop.css" />
  <link rel="stylesheet" href="../leaderboard.css" />
</head>
<body>
  <main class="game" id="gameContainer">
    <header class="game__header">
      <a href="/" class="back-link" data-i18n="backToGames">&larr; Back to Games</a>
      <h1 data-i18n="duTitle">Dress-Up</h1>
      <p data-i18n="duInstructions">Choose a character, pick outfits, and show off your style!</p>
    </header>

    <!-- HUD -->
    <div class="game__hud">
      <div class="hud__score" id="hudScore" style="display:none;">
        <span data-i18n="score">Score</span>
        <strong id="scoreDisplay">0</strong>
      </div>
      <div class="hud__timer" id="hudTimer" style="display:none;">60</div>
      <div class="hud__coins" id="hudCoinsWrap">
        <span class="hud__coins-icon">&#x1F4B0;</span>
        <strong id="hudCoins">0</strong>
      </div>
      <div class="hud__spacer"></div>
      <button id="muteButton" class="hud__button" type="button" data-i18n="duMute">Mute</button>
      <select id="musicSelect" class="hud__button">
        <option value="none">No Music</option>
        <option value="lofi">Lo-Fi Chill</option>
        <option value="poppy">Pop Beat</option>
        <option value="dreamy">Dreamy</option>
      </select>
      <button id="fullscreenButton" class="hud__button" type="button" aria-label="Toggle fullscreen">&#x26F6;</button>
    </div>

    <!-- Main Game Panel: Wardrobe LEFT | Avatar RIGHT -->
    <section class="game__panel">
      <!-- Wardrobe / Controls (LEFT) -->
      <div class="controls">
        <!-- Character Selection -->
        <div class="char-select" id="charSelect"></div>

        <!-- Category Tabs -->
        <div class="category-tabs" id="categoryTabs"></div>

        <!-- Item Grid -->
        <div class="item-grid" id="itemGrid"></div>

        <!-- Action Buttons -->
        <div class="action-buttons">
          <button class="action-btn" id="randomizeBtn" data-i18n="duRandomize">Randomize</button>
          <button class="action-btn" id="saveBtn" data-i18n="duSave">Save</button>
          <button class="action-btn" id="loadBtn" data-i18n="duLoad">Load</button>
          <button class="action-btn" id="clearBtn" data-i18n="duClear">Clear</button>
          <button class="action-btn primary" id="challengeBtn" data-i18n="duChallenge">Challenge</button>
          <button class="action-btn" id="screenshotBtn" data-i18n="duScreenshot">Screenshot</button>
          <button class="action-btn" id="runwayBtn" data-i18n="duRunway">Runway</button>
          <button class="action-btn" id="themeBtn">Theme</button>
          <button class="action-btn" id="shopBtn">Shop</button>
        </div>
      </div>

      <!-- Avatar Display (RIGHT) -->
      <div class="canvas-wrap">
        <canvas id="gameCanvas" width="400" height="600" aria-label="Dress-Up Character"></canvas>
        <div class="challenge-overlay" id="challengeOverlay">
          <div class="challenge-theme" id="challengeTheme"></div>
          <div class="challenge-stars" id="challengeStars">
            <span class="star" id="star1">&#9733;</span>
            <span class="star" id="star2">&#9733;</span>
            <span class="star" id="star3">&#9733;</span>
          </div>
          <div class="challenge-score-display" id="challengeScoreDisplay"></div>
          <button class="action-btn primary" id="challengeCloseBtn" data-i18n="duContinue">Continue</button>
        </div>
        <!-- Theme suggestion overlay -->
        <div class="theme-overlay" id="themeOverlay">
          <div class="theme-overlay__label">Style Challenge</div>
          <div class="theme-overlay__name" id="themeOverlayName"></div>
        </div>
      </div>
    </section>

    <footer class="game__footer">
      <p data-i18n="duTip">Tip: Try challenge mode to test your styling skills against the clock!</p>
    </footer>

    <!-- Achievements Panel -->
    <div class="achievements-panel" id="achievementsPanel">
      <button class="achievements-toggle" id="achievementsToggle" type="button" data-i18n="achievements">Achievements</button>
      <div class="achievements-list" id="achievementsList"></div>
    </div>
  </main>

  <!-- Achievement Popup -->
  <div class="achievement-popup" id="achievementPopup">
    <div class="achievement-popup__icon" id="achievementPopupIcon"></div>
    <div class="achievement-popup__text">
      <strong id="achievementPopupTitle"></strong>
      <span id="achievementPopupDesc"></span>
    </div>
  </div>

  <!-- Load Modal -->
  <div class="modal-overlay" id="loadModal">
    <div class="modal">
      <h3 data-i18n="duLoadOutfit">Load Outfit</h3>
      <div class="saved-outfits" id="savedOutfits"></div>
      <button class="modal-close" id="loadModalClose" data-i18n="duClose">Close</button>
    </div>
  </div>

  <!-- Premium Unlock Modal -->
  <div class="modal-overlay" id="premiumModal">
    <div class="modal premium-modal">
      <h3>&#x2B50; Premium Item</h3>
      <p class="premium-modal__item" id="premiumItemName"></p>
      <div class="premium-modal__actions">
        <button class="action-btn primary" id="premiumBuyBtn">Unlock (<span id="premiumCost">0</span> coins)</button>
      </div>
      <button class="modal-close" id="premiumModalClose">Close</button>
    </div>
  </div>

  <!-- Shop Modal injected by shared shop.js -->

  <!-- Leaderboard -->
  <div id="leaderboardPanel"></div>

  <!-- Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <link rel="stylesheet" href="../arcade.css">
  <script src="../arcade.js"></script>
  <script src="../leaderboard.js"></script>
  <script src="../i18n.js"></script>
  <script src="audio.js"></script>
  <script src="../shop.js"></script>
  <script src="game.js"></script>
  <script>if(typeof Arcade!=='undefined')Arcade.injectNavHUD();</script>
</body>
</html>
