<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-VMLC97VBGN"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-VMLC97VBGN');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dragon Engineering Lab — SlayPlay</title>
  <meta property="og:site_name" content="SlayPlay">
  <meta property="og:title" content="Dragon Engineering Lab">
  <meta property="og:description" content="Design a biologically plausible dragon. Test flight, fire, and survival under real scientific constraints.">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- HEADER -->
  <header class="app-header">
    <div class="header-left">
      <h1 class="app-title">Dragon Engineering Lab</h1>
    </div>
    <nav class="tab-bar">
      <button class="tab-btn active" data-tab="build">Build</button>
      <button class="tab-btn" data-tab="simulate">Simulate</button>
      <button class="tab-btn" data-tab="habitat">Habitat</button>
      <button class="tab-btn" data-tab="battle">Battle</button>
      <button class="tab-btn" data-tab="challenges">Challenges</button>
      <button class="tab-btn" data-tab="science">Science</button>
    </nav>
    <div class="header-right">
      <button class="mode-toggle" id="btn-mode" title="Switch Basic / Advanced">Basic</button>
      <button class="btn-icon" id="btn-tutorial" title="Replay Tutorial">?</button>
    </div>
  </header>

  <!-- MAIN LAYOUT -->
  <main class="app-main">
    <!-- LEFT PANEL: Controls -->
    <aside class="panel panel-left" id="controls-panel">
      <!-- Dragon name -->
      <div class="dragon-name-wrap">
        <input type="text" id="dragon-name-input" class="dragon-name-input" placeholder="Name your dragon..." maxlength="32" autocomplete="off">
        <div class="color-row" id="color-row">
          <div class="color-swatch active" data-color="#3a6e5a" style="background:#3a6e5a" title="Forest"></div>
          <div class="color-swatch" data-color="#7a2828" style="background:#7a2828" title="Crimson"></div>
          <div class="color-swatch" data-color="#1a3a8e" style="background:#1a3a8e" title="Sapphire"></div>
          <div class="color-swatch" data-color="#6a1a8e" style="background:#6a1a8e" title="Amethyst"></div>
          <div class="color-swatch" data-color="#8e6a1a" style="background:#8e6a1a" title="Gold"></div>
          <div class="color-swatch" data-color="#1a6e8e" style="background:#1a6e8e" title="Ocean"></div>
          <div class="color-swatch" data-color="#1e1e2e" style="background:#1e1e2e" title="Obsidian"></div>
          <label class="color-custom-label" title="Custom colour">
            <input type="color" id="dragon-color-input" value="#3a6e5a">
            <span>+</span>
          </label>
        </div>
      </div>
      <div class="action-bar">
        <button class="btn-primary" id="btn-simulate">Run Simulation</button>
      </div>
      <div class="action-bar-secondary">
        <button class="btn-secondary" id="btn-randomize">Randomize</button>
        <button class="btn-secondary" id="btn-reset">Reset</button>
        <button class="btn-secondary" id="btn-save">Save</button>
      </div>

      <!-- Presets -->
      <div class="presets-section">
        <div class="section-label">Presets</div>
        <div id="presets-container" class="presets-row"></div>
      </div>

      <!-- Sliders (populated by JS) -->
      <div id="sliders-container" class="sliders-container"></div>
    </aside>

    <!-- CENTER: 3D Canvas -->
    <section class="panel panel-center">
      <div id="canvas-container" class="canvas-container"></div>
    </section>

    <!-- RIGHT PANEL: Results / Context -->
    <aside class="panel panel-right">
      <div class="tab-content active" id="tab-build">
        <div class="panel-title">Quick Preview</div>
        <div id="results-content" class="results-content">
          <p class="placeholder-text">Adjust traits and run a simulation to see results.</p>
        </div>
      </div>

      <div class="tab-content" id="tab-simulate">
        <div class="panel-title">Simulation Results</div>
        <div id="results-content-sim" class="results-content"></div>
      </div>

      <div class="tab-content" id="tab-habitat">
        <div class="panel-title">Habitat Testing</div>
        <div id="habitat-selector" class="habitat-selector"></div>
        <div id="habitat-results" class="habitat-results"></div>
        <button class="btn-secondary" id="btn-hab-return" style="margin-top:12px">Reset Environment</button>
      </div>

      <div class="tab-content" id="tab-battle">
        <div class="panel-title" id="battle-panel">Battle Arena</div>
        <div id="battle-setup" class="battle-setup"></div>
        <div id="battle-display" class="battle-display" style="display:none"></div>
      </div>

      <div class="tab-content" id="tab-challenges">
        <div class="panel-title">Challenges <span id="challenge-progress-label" class="challenge-progress-label"></span></div>
        <div id="challenges-content" class="challenges-content"></div>
      </div>

      <div class="tab-content" id="tab-science">
        <div class="panel-title">Research Database</div>
        <div id="science-notes-content" class="science-notes-content"></div>
      </div>
    </aside>
  </main>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.135.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.135.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.135.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="data.js?v=6"></script>
  <script src="challenges.js?v=6"></script>
  <script src="dragon.js?v=6"></script>
  <script src="simulation.js?v=6"></script>
  <script src="explanations.js?v=6"></script>
  <script src="dragon-canvas.js?v=9"></script>
  <script src="scene.js?v=11"></script>
  <script src="battle.js?v=9"></script>
  <script src="ui.js?v=9"></script>
  <script src="tutorial.js?v=9"></script>
  <script src="main.js?v=9"></script>
</body>
</html>
