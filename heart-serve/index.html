<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HeartServe: Love &amp; Ping Pong</title>
  <link rel="stylesheet" href="styles.css">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-VMLC97VBGN"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-VMLC97VBGN');
  </script>
</head>
<body>
  <a href="/" class="back-link">&larr; Back</a>

  <div id="gameContainer">
    <!-- Floating particles layer -->
    <canvas id="particleCanvas"></canvas>

    <!-- ═══ TITLE SCREEN ═══ -->
    <div class="screen active" id="titleScreen">
      <div class="title-deco">
        <div class="title-heart title-heart-1">&hearts;</div>
        <div class="title-heart title-heart-2">&hearts;</div>
        <div class="title-heart title-heart-3">&hearts;</div>
      </div>
      <div class="title-content">
        <div class="title-icon">&hearts;</div>
        <h1 class="title-name">HeartServe</h1>
        <p class="title-sub">Love &amp; Ping Pong</p>
        <p class="title-desc">Build friendships through dialogue and ping pong matches!</p>
        <button class="btn btn-primary btn-glow" id="startBtn">New Game</button>
        <button class="btn btn-secondary" id="continueBtn" style="display:none">Continue</button>
      </div>
    </div>

    <!-- ═══ CHARACTER SELECT ═══ -->
    <div class="screen" id="selectScreen">
      <div class="select-header">
        <div class="day-badge" id="dayBadge">Day 1</div>
        <div class="affection-bar" id="topAffectionBar"></div>
      </div>
      <h2 class="screen-title">Who do you want to see today?</h2>
      <div class="char-grid" id="charGrid"></div>
    </div>

    <!-- ═══ DIALOGUE SCREEN ═══ -->
    <div class="screen" id="dialogueScreen">
      <div class="dialogue-layout">
        <div class="portrait-side">
          <canvas id="portraitCanvas" width="280" height="360"></canvas>
          <div class="char-nameplate" id="charNameplate"></div>
        </div>
        <div class="dialogue-side">
          <div class="scene-text" id="sceneText"></div>
          <div class="dialogue-box" id="dialogueBox">
            <div class="dialogue-speaker" id="dialogueSpeaker"></div>
            <div class="dialogue-text" id="dialogueText"></div>
          </div>
          <div class="choices-panel" id="choicesPanel"></div>
          <div class="reaction-box" id="reactionBox"></div>
        </div>
      </div>
    </div>

    <!-- ═══ MATCH SCREEN ═══ -->
    <div class="screen" id="matchScreen">
      <!-- Pre-match VS overlay -->
      <div class="match-ready" id="matchReady">
        <div class="vs-layout">
          <div class="vs-side vs-player">
            <div class="vs-paddle vs-paddle-you"></div>
            <div class="vs-label">You</div>
          </div>
          <div class="vs-center">
            <div class="vs-text">VS</div>
            <canvas id="vsPortrait" width="100" height="100"></canvas>
            <div class="vs-name" id="vsName"></div>
          </div>
          <div class="vs-side vs-opponent">
            <div class="vs-paddle vs-paddle-ai" id="vsPaddleAi"></div>
            <div class="vs-label" id="vsOppLabel">???</div>
          </div>
        </div>
        <button class="btn btn-primary btn-glow" id="matchStartBtn">Let's Play!</button>
      </div>
      <!-- Pong game -->
      <div class="match-playing" id="matchPlaying" style="display:none">
        <div class="pong-hud">
          <span class="pong-score pong-you" id="pScoreDisplay">0</span>
          <span class="pong-dash">&mdash;</span>
          <span class="pong-score pong-opp" id="aScoreDisplay">0</span>
        </div>
        <canvas id="pongCanvas" width="580" height="380"></canvas>
        <div class="pong-controls">Mouse or &uarr;&darr; to move &middot; First to 5</div>
      </div>
    </div>

    <!-- ═══ RESULTS SCREEN ═══ -->
    <div class="screen" id="resultsScreen">
      <div class="results-card">
        <canvas id="resultsPortrait" width="120" height="150"></canvas>
        <h2 class="results-title" id="resultsTitle">Match Over!</h2>
        <div class="results-rating" id="resultsRating"></div>
        <div class="results-scoreline" id="resultsScoreline"></div>
        <div class="results-affection-gain" id="resultsAffGain"></div>
        <div class="results-reaction" id="resultsReaction"></div>
        <hr class="results-divider">
        <div class="results-meters" id="resultsMeters"></div>
        <button class="btn btn-primary" id="nextDayBtn">Next Day</button>
      </div>
    </div>

    <!-- ═══ ENDING SCREEN ═══ -->
    <div class="screen" id="endingScreen">
      <div class="ending-card">
        <canvas id="endingPortrait" width="280" height="360"></canvas>
        <div class="ending-content">
          <div class="ending-label" id="endingLabel"></div>
          <div class="ending-speech" id="endingSpeech"></div>
          <div class="ending-narration" id="endingNarration"></div>
          <div class="ending-score" id="endingScoreText"></div>
          <div class="ending-buttons">
            <button class="btn btn-primary" id="replayBtn">Play Again</button>
            <button class="btn btn-secondary" id="homeBtn">Back to Arcade</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Platform -->
  <div id="leaderboardPanel"></div>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <link rel="stylesheet" href="../leaderboard.css">
  <link rel="stylesheet" href="../arcade.css">
  <script src="../arcade.js"></script>
  <script src="../leaderboard.js"></script>
  <script src="audio.js"></script>
  <script src="game.js"></script>
  <script>if(typeof Arcade!=='undefined')Arcade.injectNavHUD();</script>
</body>
</html>
