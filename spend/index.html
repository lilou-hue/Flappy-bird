<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spend a Billion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <!-- Global site tag (gtag.js) - Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-VMLC97VBGN"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-VMLC97VBGN');
  </script>
</head>
<body>
  <a href="/" class="back-link">&larr; Back</a>

  <div id="money-display">
    <div class="money-label">You have</div>
    <div id="remaining" class="money-amount">$1,000,000,000</div>
  </div>

  <div id="multiplier-bar">
    <span class="multiplier-label">Buy:</span>
    <button class="multiplier-btn active" data-mult="1">&times;1</button>
    <button class="multiplier-btn" data-mult="10">&times;10</button>
    <button class="multiplier-btn" data-mult="100">&times;100</button>
  </div>

  <div id="items-grid"></div>

  <div id="receipt-section">
    <h2>Your Receipt</h2>
    <div id="spent-display">Spent: $0</div>
    <div id="receipt-list"></div>
    <div id="receipt-empty">Nothing purchased yet. Start spending!</div>
  </div>

  <div id="congrats" class="hidden">
    <h1>You spent a billion dollars!</h1>
    <p>Congratulations, you absolute legend.</p>
  </div>

  <script src="game.js"></script>
</body>
</html>
