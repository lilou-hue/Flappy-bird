<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VMLC97VBGN"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-VMLC97VBGN');
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Beat Drop — SlayPlay</title>
  <meta property="og:site_name" content="SlayPlay">
  <meta property="og:title" content="Beat Drop">
  <meta property="og:description" content="Hit notes as they fall to the beat. Build your combo and top the leaderboard.">
  <meta property="og:type" content="website">
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="../shop.css" />
    <script src="../i18n.js"></script>
  </head>
  <body>
    <main class="game" id="gameContainer">
      <header class="game__header">
        <a href="/" class="back-link" data-i18n="backToGames">&larr; Back to Games</a>
        <h1 data-i18n="beatDropTitle">Beat Drop</h1>
        <p data-i18n="beatDropInstructions">Press D/F/J/K when notes reach the bottom. Stay on beat!</p>
      </header>
      <section class="game__panel">
        <canvas id="gameCanvas" width="480" height="640" aria-label="Beat Drop game"></canvas>
        <div class="game__hud">
          <div class="hud__score">
            <span data-i18n="score">Score</span>
            <strong id="score">0</strong>
          </div>
          <div class="hud__score">
            <span data-i18n="best">Best</span>
            <strong id="bestScore">0</strong>
          </div>
          <button id="muteButton" class="hud__mute" type="button" aria-label="Toggle sound">&#x1F50A;</button>
          <button id="fullscreenButton" class="hud__mute" type="button" aria-label="Toggle fullscreen">&#x26F6;</button>
          <button id="leaderboardToggle" class="hud__mute lb-toggle-btn" type="button" aria-label="Toggle leaderboard">&#x1F3C6;</button>
          <button id="restartButton" class="hud__button" type="button" data-i18n="restart">Restart</button>
          <button id="shopBtn" class="hud__button" type="button">Shop</button>
        </div>

        <div class="settings-bar">
          <div class="setting-group">
            <label for="themeSelect" data-i18n="theme">Theme</label>
            <select id="themeSelect"></select>
          </div>
          <div class="setting-group">
            <label for="practiceToggle" data-i18n="bdPractice">Practice</label>
            <select id="practiceToggle">
              <option value="off" data-i18n="off">Off</option>
              <option value="on" data-i18n="on">On</option>
            </select>
          </div>
          <div class="setting-group">
            <label for="difficultySelect" data-i18n="bdDifficulty">Difficulty</label>
            <select id="difficultySelect">
              <option value="easy" data-i18n="bdEasy">Easy</option>
              <option value="medium" selected data-i18n="bdMedium">Medium</option>
              <option value="hard" data-i18n="bdHard">Hard</option>
            </select>
          </div>
        </div>

        <!-- Touch zones -->
        <div class="touch-controls" id="touchControls">
          <button class="touch-btn" data-lane="0">D</button>
          <button class="touch-btn" data-lane="1">F</button>
          <button class="touch-btn" data-lane="2">J</button>
          <button class="touch-btn" data-lane="3">K</button>
        </div>
      </section>

      <div class="achievements-panel" id="achievementsPanel">
        <button class="achievements-toggle" id="achievementsToggle" type="button" data-i18n="achievements">Achievements</button>
        <div class="achievements-list" id="achievementsList"></div>
      </div>

      <footer class="game__footer">
        <p data-i18n="beatDropTip">Tip: The beat builds with your combo. Keep hitting perfect!</p>
      </footer>
    </main>

    <div class="achievement-popup" id="achievementPopup">
      <div class="achievement-popup__icon" id="achievementPopupIcon"></div>
      <div class="achievement-popup__text">
        <strong id="achievementPopupTitle"></strong>
        <span id="achievementPopupDesc"></span>
      </div>
    </div>

    <div id="leaderboardPanel"></div>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="../leaderboard.css">
    <link rel="stylesheet" href="../arcade.css">
    <script src="../arcade.js"></script>
    <script src="../leaderboard.js"></script>
    <script src="../shop.js?v=2"></script>
    <script src="game.js"></script>
    <script>if(typeof Arcade!=='undefined')Arcade.injectNavHUD();</script>
  </body>
</html>
