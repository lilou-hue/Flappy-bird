<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VMLC97VBGN"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-VMLC97VBGN');
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Tetris — SlayPlay</title>
  <meta property="og:site_name" content="SlayPlay">
  <meta property="og:title" content="Tetris">
  <meta property="og:description" content="Stack blocks, clear lines, and chase the high score. The classic puzzle game, free in your browser.">
  <meta property="og:type" content="website">
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="../shop.css" />
    <script src="../i18n.js"></script>
  </head>
  <body>
    <main class="game" id="gameContainer">
      <header class="game__header">
        <a href="/arcade/" class="back-link" data-i18n="backToGames">&larr; Back to Games</a>
        <h1 data-i18n="tetrisTitle">Tetris</h1>
        <p data-i18n="tetrisInstructions">Arrow keys to move &amp; rotate. Space to hard drop. Shift to hold.</p>
      </header>
      <div class="settings-bar">
        <div class="setting-group">
          <label for="themeSelect" data-i18n="tetThemeLabel">Theme</label>
          <select id="themeSelect"></select>
        </div>
        <div class="setting-group">
          <label for="skinSelect" data-i18n="tetSkinLabel">Skin</label>
          <select id="skinSelect"></select>
        </div>
      </div>
      <section class="game__panel">
        <canvas id="gameCanvas" width="480" height="640" aria-label="Tetris game"></canvas>
        <div class="game__hud">
          <div class="hud__score">
            <span data-i18n="score">Score</span>
            <strong id="score">0</strong>
          </div>
          <div class="hud__score">
            <span data-i18n="best">Best</span>
            <strong id="bestScore">0</strong>
          </div>
          <button id="muteButton" class="hud__mute" type="button" aria-label="Toggle sound">&#x1F50A;</button>
          <button id="fullscreenButton" class="hud__mute" type="button" aria-label="Toggle fullscreen" data-i18n-aria="fullscreen">&#x26F6;</button>
          <button id="leaderboardToggle" class="lb-toggle-btn" type="button" aria-label="Toggle leaderboard">&#x1F3C6;</button>
          <button id="restartButton" class="hud__button" type="button" data-i18n="restart">Restart</button>
          <button id="challengeModeButton" class="hud__button" type="button" data-i18n="tetChallengeMode">Challenge</button>
          <button id="shopBtn" class="hud__button" type="button">Shop</button>
        </div>
      </section>
      <div class="touch-controls" id="touchControls">
        <button class="touch-btn" data-action="moveLeft" aria-label="Move left">&larr;</button>
        <button class="touch-btn" data-action="rotateCCW" aria-label="Rotate left">&#8634;</button>
        <button class="touch-btn touch-btn--accent" data-action="hardDrop" aria-label="Hard drop">&darr;&darr;</button>
        <button class="touch-btn" data-action="rotateCW" aria-label="Rotate right">&#8635;</button>
        <button class="touch-btn" data-action="moveRight" aria-label="Move right">&rarr;</button>
        <button class="touch-btn touch-btn--wide" data-action="softDrop" aria-label="Soft drop">&darr; Drop</button>
        <button class="touch-btn touch-btn--wide" data-action="hold" aria-label="Hold piece">Hold</button>
      </div>
      <footer class="game__footer">
        <p data-i18n="tetrisTip">Tip: hold a piece with Shift or C. Clear 4 lines at once for a Tetris!</p>
      </footer>
      <!-- Achievements panel -->
      <div class="achievements-panel" id="achievementsPanel">
        <button class="achievements-toggle" id="achievementsToggle" type="button" data-i18n="achievements">Achievements</button>
        <div class="achievements-list" id="achievementsList"></div>
      </div>
    </main>
    <!-- Achievement popup -->
    <div class="achievement-popup" id="achievementPopup">
      <div class="achievement-popup__icon" id="achievementPopupIcon"></div>
      <div class="achievement-popup__text">
        <strong id="achievementPopupTitle"></strong>
        <span id="achievementPopupDesc"></span>
      </div>
    </div>
    <div id="leaderboardPanel"></div>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="../leaderboard.css">
    <link rel="stylesheet" href="../arcade.css">
    <script src="../arcade.js"></script>
    <script src="../leaderboard.js"></script>
    <script src="audio.js"></script>
    <script src="../shop.js"></script>
    <script src="game.js"></script>
    <script>if(typeof Arcade!=='undefined')Arcade.injectNavHUD();</script>
  </body>
</html>
