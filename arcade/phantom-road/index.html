<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VMLC97VBGN"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-VMLC97VBGN');
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Phantom Road — SlayPlay</title>
  <meta property="og:site_name" content="SlayPlay">
  <meta property="og:title" content="Phantom Road">
  <meta property="og:description" content="Race through the dark, chain combos, grab power-ups, and evade the police.">
  <meta property="og:type" content="website">
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="../shop.css" />
    <script src="../i18n.js"></script>
  </head>
  <body>
    <main class="game">
      <header class="game__header">
        <a href="/arcade/" class="back-link" data-i18n="backToGames">&larr; Back to Games</a>
        <h1 data-i18n="phantomRoadTitle">Phantom Road</h1>
        <p data-i18n="prInstructions">Steer through the dark. Your headlights are all you have.</p>
      </header>
      <section class="game__panel">
        <canvas id="gameCanvas" width="480" height="720" aria-label="Phantom Road game"></canvas>
        <div class="game__hud">
          <div class="hud__score">
            <span data-i18n="prDistanceLabel">Distance</span>
            <strong id="score">0</strong>
          </div>
          <div class="hud__score">
            <span data-i18n="best">Best</span>
            <strong id="bestScore">0</strong>
          </div>
          <button id="muteButton" class="hud__mute" type="button" aria-label="Toggle sound">&#x1F50A;</button>
          <button id="leaderboardToggle" class="lb-toggle-btn" type="button" aria-label="Toggle leaderboard">&#x1F3C6;</button>
          <button id="fullscreenButton" class="hud__mute" type="button" aria-label="Toggle fullscreen">&#x26F6;</button>
          <button id="skinButton" class="hud__button" type="button" data-i18n="prSkinSelect">Skin</button>
          <button id="shopBtn" class="hud__button" type="button">Shop</button>
          <button id="restartButton" class="hud__button" type="button" data-i18n="restart">Restart</button>
        </div>
      </section>
      <footer class="game__footer">
        <p data-i18n="prTip">Chain near-misses &amp; coins for combos &mdash; collect power-ups &amp; evade the police!</p>
      </footer>
      <!-- Achievements panel -->
      <div class="achievements-panel" id="achievementsPanel">
        <button class="achievements-toggle" id="achievementsToggle" type="button" data-i18n="achievements">Achievements</button>
        <div class="achievements-list" id="achievementsList"></div>
      </div>
    </main>
    <!-- Achievement popup -->
    <div class="achievement-popup" id="achievementPopup">
      <div class="achievement-popup__icon" id="achievementPopupIcon"></div>
      <div class="achievement-popup__text">
        <strong id="achievementPopupTitle"></strong>
        <span id="achievementPopupDesc"></span>
      </div>
    </div>
    <div id="leaderboardPanel"></div>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="../leaderboard.css">
    <link rel="stylesheet" href="../arcade.css">
    <script src="../arcade.js"></script>
    <script src="../leaderboard.js"></script>
    <script src="../shop.js"></script>
    <script src="game.js"></script>
    <script>if(typeof Arcade!=='undefined')Arcade.injectNavHUD();</script>
  </body>
</html>
