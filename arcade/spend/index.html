<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spend — SlayPlay</title>
  <meta property="og:site_name" content="SlayPlay">
  <meta property="og:title" content="Spend">
  <meta property="og:description" content="You have a billion dollars. How fast can you spend it all?">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <!-- Global site tag (gtag.js) - Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-VMLC97VBGN"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-VMLC97VBGN');
  </script>
</head>
<body>
  <a href="/arcade/" class="back-link" data-i18n="buildCityBack">&larr; Back</a>

  <div id="money-display">
    <div class="money-label" data-i18n="buildCityBudget">City Budget</div>
    <div id="remaining" class="money-amount">$1,000,000,000</div>
  </div>

  <div id="multiplier-bar">
    <span class="multiplier-label" data-i18n="buildCityBuild">Build:</span>
    <button class="multiplier-btn active" data-mult="1">&times;1</button>
    <button class="multiplier-btn" data-mult="10">&times;10</button>
    <button class="multiplier-btn" data-mult="100">&times;100</button>
  </div>

  <div id="items-grid"></div>

  <div id="receipt-section">
    <h2 data-i18n="buildCityPlan">City Plan</h2>
    <div id="spent-display">Allocated: $0</div>
    <div id="receipt-list"></div>
    <div id="receipt-empty" data-i18n="buildCityStartBuilding">Start building your city!</div>
  </div>

  <div id="congrats" class="hidden">
    <h1 data-i18n="buildCityComplete">Your city is complete!</h1>
    <p data-i18n="buildCityCompleteDesc">Every dollar invested. What a mayor you are.</p>
  </div>

  <script src="../i18n.js"></script>
  <script src="game.js"></script>
</body>
</html>
