<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Google tag (gtag.js) -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Player Profile</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../arcade.css">
    <style>
      :root { font-family: "Segoe UI", "Trebuchet MS", system-ui, sans-serif; color-scheme: dark; }
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        min-height: 100vh;
        background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
        color: #f0f0f0;
        padding: 2rem 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .back-link {
        align-self: flex-start;
        color: #aaa;
        text-decoration: none;
        font-size: 0.95rem;
        margin-bottom: 1.5rem;
        transition: color 0.2s;
      }
      .back-link:hover { color: #fff; }

      .profile-header {
        text-align: center;
        margin-bottom: 2rem;
      }
      .profile-header h1 {
        font-size: 2.2rem;
        background: linear-gradient(90deg, #ffcc4d, #ff7b54, #ff4da6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 0.3rem;
      }
      .profile-nickname {
        font-size: 1.2rem;
        color: #ccc;
      }

      /* Stats overview */
      .stats-overview {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        justify-content: center;
        margin-bottom: 2rem;
        max-width: 600px;
        width: 100%;
      }
      .stat-card {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 12px;
        padding: 1rem 1.5rem;
        text-align: center;
        flex: 1;
        min-width: 120px;
        backdrop-filter: blur(8px);
      }
      .stat-card .stat-value {
        font-size: 1.8rem;
        font-weight: 700;
        color: #ffcc4d;
        display: block;
      }
      .stat-card .stat-label {
        font-size: 0.8rem;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-top: 0.2rem;
      }

      /* Game scores grid */
      .scores-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 1rem;
        max-width: 600px;
        width: 100%;
        margin-bottom: 2rem;
      }
      .score-card {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 12px;
        padding: 1rem 1.2rem;
        display: flex;
        align-items: center;
        gap: 1rem;
        backdrop-filter: blur(8px);
        transition: transform 0.2s, border-color 0.2s;
      }
      .score-card:hover {
        transform: translateY(-2px);
      }
      .score-icon {
        font-size: 1.8rem;
        width: 48px;
        height: 48px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .score-info { flex: 1; }
      .score-info h3 {
        font-size: 1rem;
        margin-bottom: 0.2rem;
      }
      .score-info .score-best {
        font-size: 1.4rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .score-info .score-label {
        font-size: 0.75rem;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .no-score {
        color: #555;
        font-style: italic;
        font-size: 0.9rem;
      }

      /* Game-specific accent colors */
      .accent-flappy    { border-left: 3px solid #7be495; }
      .accent-flappy .score-icon  { background: rgba(123,228,149,0.15); color: #7be495; }
      .accent-flappy .score-best  { color: #7be495; }

      .accent-tetris    { border-left: 3px solid #00d4ff; }
      .accent-tetris .score-icon  { background: rgba(0,212,255,0.15); color: #00d4ff; }
      .accent-tetris .score-best  { color: #00d4ff; }

      .accent-snake     { border-left: 3px solid #39ff14; }
      .accent-snake .score-icon   { background: rgba(57,255,20,0.15); color: #39ff14; }
      .accent-snake .score-best   { color: #39ff14; }

      .accent-lumina    { border-left: 3px solid #4dc9f6; }
      .accent-lumina .score-icon  { background: rgba(77,201,246,0.15); color: #4dc9f6; }
      .accent-lumina .score-best  { color: #4dc9f6; }

      .accent-phantom   { border-left: 3px solid #ff8c32; }
      .accent-phantom .score-icon { background: rgba(255,140,50,0.15); color: #ff8c32; }
      .accent-phantom .score-best { color: #ff8c32; }

      .accent-methane   { border-left: 3px solid #17cdd3; }
      .accent-methane .score-icon { background: rgba(23,205,211,0.15); color: #17cdd3; }
      .accent-methane .score-best { color: #17cdd3; }

      .accent-unicorn   { border-left: 3px solid #ff69b4; }
      .accent-unicorn .score-icon { background: rgba(255,105,180,0.15); color: #ff69b4; }
      .accent-unicorn .score-best { color: #ff69b4; }

      .accent-gungame   { border-left: 3px solid #ff6b35; }
      .accent-gungame .score-icon { background: rgba(255,107,53,0.15); color: #ff6b35; }
      .accent-gungame .score-best { color: #ff6b35; }

      .accent-astrominer { border-left: 3px solid #00e5ff; }
      .accent-astrominer .score-icon { background: rgba(0,229,255,0.15); color: #00e5ff; }
      .accent-astrominer .score-best { color: #00e5ff; }

      .accent-starfury { border-left: 3px solid #f5c842; }
      .accent-starfury .score-icon { background: rgba(245,200,66,0.15); color: #f5c842; }
      .accent-starfury .score-best { color: #f5c842; }

      .accent-inkognito { border-left: 3px solid #e040fb; }
      .accent-inkognito .score-icon { background: rgba(224,64,251,0.15); color: #e040fb; }
      .accent-inkognito .score-best { color: #e040fb; }

      .accent-dressup { border-left: 3px solid #f48fb1; }
      .accent-dressup .score-icon { background: rgba(244,143,177,0.15); color: #f48fb1; }
      .accent-dressup .score-best { color: #f48fb1; }

      .accent-stacktower { border-left: 3px solid #ffab40; }
      .accent-stacktower .score-icon { background: rgba(255,171,64,0.15); color: #ffab40; }
      .accent-stacktower .score-best { color: #ffab40; }

      .accent-neonpong { border-left: 3px solid #76ff03; }
      .accent-neonpong .score-icon { background: rgba(118,255,3,0.15); color: #76ff03; }
      .accent-neonpong .score-best { color: #76ff03; }

      .accent-beatdrop { border-left: 3px solid #ea80fc; }
      .accent-beatdrop .score-icon { background: rgba(234,128,252,0.15); color: #ea80fc; }
      .accent-beatdrop .score-best { color: #ea80fc; }

      .accent-rivals { border-left: 3px solid #ff5252; }
      .accent-rivals .score-icon { background: rgba(255,82,82,0.15); color: #ff5252; }
      .accent-rivals .score-best { color: #ff5252; }

      .accent-gravitygarden { border-left: 3px solid #69f0ae; }
      .accent-gravitygarden .score-icon { background: rgba(105,240,174,0.15); color: #69f0ae; }
      .accent-gravitygarden .score-best { color: #69f0ae; }

      .accent-lastseenon { border-left: 3px solid #40c4ff; }
      .accent-lastseenon .score-icon { background: rgba(64,196,255,0.15); color: #40c4ff; }
      .accent-lastseenon .score-best { color: #40c4ff; }

      .accent-artofnothing { border-left: 3px solid #b388ff; }
      .accent-artofnothing .score-icon { background: rgba(179,136,255,0.15); color: #b388ff; }
      .accent-artofnothing .score-best { color: #b388ff; }

      .accent-heartserve { border-left: 3px solid #ff80ab; }
      .accent-heartserve .score-icon { background: rgba(255,128,171,0.15); color: #ff80ab; }
      .accent-heartserve .score-best { color: #ff80ab; }

      .accent-signallost { border-left: 3px solid #84ffff; }
      .accent-signallost .score-icon { background: rgba(132,255,255,0.15); color: #84ffff; }
      .accent-signallost .score-best { color: #84ffff; }

      /* Entrance animation */
      .score-card {
        opacity: 0;
        transform: translateY(12px);
        animation: cardIn 0.35s ease forwards;
      }
      .score-card:nth-child(1) { animation-delay: 0.05s; }
      .score-card:nth-child(2) { animation-delay: 0.1s; }
      .score-card:nth-child(3) { animation-delay: 0.15s; }
      .score-card:nth-child(4) { animation-delay: 0.2s; }
      .score-card:nth-child(5) { animation-delay: 0.25s; }
      .score-card:nth-child(6) { animation-delay: 0.3s; }
      .score-card:nth-child(7) { animation-delay: 0.35s; }
      .score-card:nth-child(8) { animation-delay: 0.4s; }
      .score-card:nth-child(9) { animation-delay: 0.45s; }
      .score-card:nth-child(10) { animation-delay: 0.5s; }
      .score-card:nth-child(11) { animation-delay: 0.55s; }
      .score-card:nth-child(12) { animation-delay: 0.6s; }
      .score-card:nth-child(13) { animation-delay: 0.65s; }
      .score-card:nth-child(14) { animation-delay: 0.7s; }
      .score-card:nth-child(15) { animation-delay: 0.75s; }
      .score-card:nth-child(16) { animation-delay: 0.8s; }
      .score-card:nth-child(17) { animation-delay: 0.85s; }
      .score-card:nth-child(18) { animation-delay: 0.9s; }
      .score-card:nth-child(19) { animation-delay: 0.95s; }
      .score-card:nth-child(20) { animation-delay: 1.0s; }
      .score-card:nth-child(21) { animation-delay: 1.05s; }

      @keyframes cardIn {
        to { opacity: 1; transform: translateY(0); }
      }

      /* Achievements section */
      .ach-section {
        max-width: 600px;
        width: 100%;
        margin-bottom: 2rem;
      }
      .ach-section h2 {
        font-size: 1.4rem;
        margin-bottom: 1rem;
        color: #ffcc4d;
      }
      .ach-total {
        text-align: center;
        margin-bottom: 1rem;
        font-size: 1.1rem;
        color: #ccc;
      }
      .ach-total strong {
        color: #ffcc4d;
        font-size: 1.3rem;
      }
      .ach-bar-bg {
        width: 100%;
        height: 8px;
        background: rgba(255,255,255,0.1);
        border-radius: 4px;
        margin-bottom: 1rem;
        overflow: hidden;
      }
      .ach-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, #ffcc4d, #ff7b54);
        border-radius: 4px;
        transition: width 0.6s ease;
      }
      .ach-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 0.75rem;
      }
      .ach-game {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 10px;
        padding: 0.75rem 1rem;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        backdrop-filter: blur(8px);
      }
      .ach-game-icon { font-size: 1.4rem; }
      .ach-game-info { flex: 1; }
      .ach-game-info h4 { font-size: 0.9rem; margin-bottom: 0.15rem; }
      .ach-game-info span { font-size: 0.8rem; color: #888; }
      .ach-game-count {
        font-weight: 700;
        font-size: 1rem;
        color: #ffcc4d;
      }

      @media (max-width: 600px) {
        body { padding: 1rem 0.75rem; }
        .profile-header h1 { font-size: 1.8rem; }
        .scores-grid { grid-template-columns: 1fr; }
        .ach-grid { grid-template-columns: 1fr; }
        .stat-card .stat-value { font-size: 1.4rem; }
      }
    </style>
  </head>
  <body>
    <a href="/" class="back-link" data-i18n="backToGames">&larr; Back to Games</a>

    <div class="profile-header">
      <h1 data-i18n="profileTitle">Player Profile</h1>
      <p class="profile-nickname" id="nickname"></p>
    </div>

    <div class="stats-overview" id="statsOverview">
      <div class="stat-card">
        <span class="stat-value" id="totalScore">0</span>
        <span class="stat-label" data-i18n="profileTotalScore">Total Best Score</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="gamesPlayed">0</span>
        <span class="stat-label" data-i18n="profileGamesPlayed">Games Played</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="totalRuns">0</span>
        <span class="stat-label" data-i18n="profileTotalRuns">Total Runs</span>
      </div>
    </div>

    <!-- Arcade: Coin Balance & Equipped Items -->
    <div id="arcadeProfileSection" style="max-width:600px; width:100%; margin-bottom:1.5rem;"></div>

    <div class="scores-grid" id="scoresGrid"></div>

    <div class="ach-section">
      <h2 data-i18n="profileAchievements">Achievements</h2>
      <div class="ach-total" id="achTotal"></div>
      <div class="ach-bar-bg"><div class="ach-bar-fill" id="achBar"></div></div>
      <div class="ach-grid" id="achGrid"></div>
    </div>

    <script src="../arcade.js"></script>
    <script src="../i18n.js"></script>
    <script>
    /* Arcade profile section */
    (function () {
      if (typeof Arcade === 'undefined') return;
      Arcade.injectNavHUD();
      var p = Arcade.getProfileData();
      var streak = p.streak;
      var section = document.getElementById('arcadeProfileSection');
      if (!section) return;

      /* OG Badge */
      var ogBadge = Arcade.getOGBadge ? Arcade.getOGBadge() : null;
      var ogHtml = '';
      if (ogBadge) {
        var tierClass = ogBadge.tier === 'founding' ? ' arc-og-badge--founding' : '';
        ogHtml = '<div style="text-align:center;margin-bottom:1rem;">' +
          '<span class="arc-og-badge' + tierClass + '">' + ogBadge.icon + ' ' + ogBadge.title +
          (ogBadge.tier === 'founding' ? ' (Founding Member)' : '') + '</span></div>';
      }

      /* Coin balance */
      var coinHtml = ogHtml + '<div class="arc-coin-header" style="margin-bottom:1rem;">' +
        '<div class="arc-coin-header__balance">&#x1FA99; <span class="arc-coin-value">' + p.coins + '</span> coins' +
        '<span style="margin-left:0.75rem;font-size:0.8rem;color:#a1a1aa;">(' + p.totalCoinsEarned + ' earned / ' + p.totalCoinsSpent + ' spent)</span></div>' +
      '</div>';

      /* Equipped items */
      var items = Arcade.getShopItems();
      var slots = ['badge', 'theme', 'frame'];
      var equippedHtml = '<div class="arc-equipped">' + slots.map(function (cat) {
        var eqId = p['equipped' + cat.charAt(0).toUpperCase() + cat.slice(1)];
        var item = eqId ? items.find(function (i) { return i.id === eqId; }) : null;
        return '<div class="arc-equipped__slot' + (item ? ' arc-equipped__slot--filled' : '') + '">' +
          '<div class="arc-equipped__label">' + cat + '</div>' +
          '<div class="arc-equipped__icon">' + (item ? item.icon : '-') + '</div>' +
        '</div>';
      }).join('') + '</div>';

      /* Streak calendar (7-day visualization) */
      var days = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
      var todayIdx = new Date().getDay();
      var streakHtml = '<div style="text-align:center;margin-bottom:0.5rem;font-size:0.82rem;color:#a1a1aa;">Play Streak: ' + streak + ' day' + (streak !== 1 ? 's' : '') + '</div>' +
        '<div class="arc-streak-cal">' + days.map(function (d, i) {
        var isToday = i === todayIdx;
        var isActive = streak > 0 && ((todayIdx - i + 7) % 7) < streak;
        var cls = 'arc-streak-dot' + (isActive ? ' arc-streak-dot--active' : '') + (isToday ? ' arc-streak-dot--today' : '');
        return '<div class="' + cls + '">' + d + '</div>';
      }).join('') + '</div>';

      /* Favorite game */
      var favHtml = '<div style="text-align:center;margin:1rem 0;font-size:0.88rem;color:#a1a1aa;">Favorite Game: <strong style="color:#c084fc;">' + p.favoriteGame + '</strong></div>';

      section.innerHTML = coinHtml + equippedHtml + streakHtml + favHtml;
    })();
    </script>
    <script>
    (function() {
      const games = [
        { id: 'flappy',  key: 'flappyBest',       title: 'Flappy Bird',          icon: '\uD83D\uDC26', accent: 'flappy',  label: 'Best Score' },
        { id: 'tetris',  key: 'tetrisBest',        title: 'Tetris',               icon: '\uD83D\uDFE6', accent: 'tetris',  label: 'Best Score' },
        { id: 'snake',   key: 'snakeBest',         title: 'Snake',                icon: '\uD83D\uDC0D', accent: 'snake',   label: 'Best Score' },
        { id: 'lumina',  key: 'luminaBest',        title: 'Lumina',               icon: '\uD83D\uDD2E', accent: 'lumina',  label: 'Best Depth' },
        { id: 'phantom', key: 'phantomRoadBest',   title: 'Phantom Road',         icon: '\uD83D\uDE97', accent: 'phantom', label: 'Best Distance' },
        { id: 'methane', key: 'methaneDriftBest',  title: 'Methane Drift',        icon: '\uD83D\uDE80', accent: 'methane', label: 'Best Score' },
        { id: 'unicorn', key: null,                title: 'Unicorn Fart Clicker', icon: '\uD83E\uDD84', accent: 'unicorn', label: 'Lifetime SP', saveKey: 'unicornClickerSave', field: 'lifetimeSP' },
        { id: 'gungame', key: 'gunGameBest',       title: 'Gun Game',             icon: '\uD83D\uDD2B', accent: 'gungame', label: 'Best Score' },
        { id: 'astrominer', key: 'astroMinerBest', title: 'Astro Miner',          icon: '\u26CF\uFE0F', accent: 'astrominer', label: 'Best Score' },
        { id: 'starfury',    key: 'starFuryBest',          title: 'Star Fury',            icon: '\uD83C\uDF1F', accent: 'starfury',      label: 'Best Score' },
        { id: 'inkognito',   key: 'inkognitoBest',         title: 'Inkognito',            icon: '\uD83C\uDFA8', accent: 'inkognito',     label: 'Best Score' },
        { id: 'dressup',     key: 'dressUpBest',           title: 'Dress-Up',             icon: '\uD83D\uDC57', accent: 'dressup',       label: 'Best Score' },
        { id: 'stacktower',  key: 'stackTowerBest',        title: 'Stack Tower',          icon: '\uD83C\uDFD7\uFE0F', accent: 'stacktower',  label: 'Best Score' },
        { id: 'neonpong',    key: 'neonPongBest',          title: 'Neon Pong',            icon: '\uD83C\uDFD3', accent: 'neonpong',      label: 'Best Score' },
        { id: 'beatdrop',    key: 'beatDropBest',          title: 'Beat Drop',            icon: '\uD83C\uDFB5', accent: 'beatdrop',      label: 'Best Score' },
        { id: 'rivals',      key: 'rivalsBest',            title: 'Rivals',               icon: '\u2694\uFE0F', accent: 'rivals',        label: 'Best Score' },
        { id: 'gravitygarden', key: 'gravityGardenBest',   title: 'Gravity Garden',       icon: '\uD83C\uDF31', accent: 'gravitygarden', label: 'Best Score' },
        { id: 'lastseenon',  key: 'lastSeenOnlineBest',    title: 'Last Seen Online',     icon: '\uD83D\uDCF1', accent: 'lastseenon',    label: 'Best Score' },
        { id: 'artofnothing', key: 'artOfDoingNothingBest', title: 'Art of Doing Nothing', icon: '\uD83E\uDDD8', accent: 'artofnothing',  label: 'Best Score' },
        { id: 'heartserve',  key: 'heartServeBest',        title: 'HeartServe',           icon: '\uD83D\uDC95', accent: 'heartserve',    label: 'Best Score' },
        { id: 'signallost',  key: 'signalLostBest',        title: 'Signal Lost',          icon: '\uD83D\uDCE1', accent: 'signallost',    label: 'Best Score' },
      ];

      // Read nickname
      const nickname = localStorage.getItem('arcade_nickname') || 'Player';
      document.getElementById('nickname').textContent = nickname;

      // Read scores
      let totalScore = 0;
      let gamesWithScore = 0;
      const grid = document.getElementById('scoresGrid');

      for (const game of games) {
        let score = 0;
        if (game.saveKey) {
          try {
            const save = JSON.parse(localStorage.getItem(game.saveKey) || '{}');
            score = Number(save[game.field]) || 0;
          } catch(e) {}
        } else if (game.key) {
          score = Number(localStorage.getItem(game.key)) || 0;
        }

        if (score > 0) {
          gamesWithScore++;
          totalScore += score;
        }

        const card = document.createElement('div');
        card.className = 'score-card accent-' + game.accent;
        card.innerHTML =
          '<div class="score-icon">' + game.icon + '</div>' +
          '<div class="score-info">' +
            '<h3>' + game.title + '</h3>' +
            (score > 0
              ? '<span class="score-best">' + score.toLocaleString() + '</span><span class="score-label">' + game.label + '</span>'
              : '<span class="no-score">Not played yet</span>') +
          '</div>';
        grid.appendChild(card);
      }

      document.getElementById('totalScore').textContent = totalScore.toLocaleString();
      document.getElementById('gamesPlayed').textContent = gamesWithScore + '/' + games.length;

      // Total runs from methane drift progress
      let totalRuns = 0;
      try {
        const mdProgress = JSON.parse(localStorage.getItem('methaneDriftProgress') || '{}');
        totalRuns += Number(mdProgress.totalRuns) || 0;
      } catch(e) {}
      try {
        totalRuns += Number(localStorage.getItem('gunGameWins')) || 0;
      } catch(e) {}
      document.getElementById('totalRuns').textContent = totalRuns > 0 ? totalRuns : '-';

      // Achievements summary
      const achGames = [
        { title: 'Flappy Bird',          icon: '\uD83D\uDC26', key: 'flappyAch',          total: 6 },
        { title: 'Tetris',               icon: '\uD83D\uDFE6', key: 'tetrisAch',          total: 6 },
        { title: 'Snake',                icon: '\uD83D\uDC0D', key: 'snakeAch',           total: 18 },
        { title: 'Lumina',               icon: '\uD83D\uDD2E', key: 'luminaAch',          total: 6 },
        { title: 'Phantom Road',         icon: '\uD83D\uDE97', key: 'phantomRoadAch',     total: 6 },
        { title: 'Methane Drift',        icon: '\uD83D\uDE80', key: 'methaneDriftProgress', total: 6, nested: 'achievements' },
        { title: 'Gun Game',             icon: '\uD83D\uDD2B', key: 'gunGameAch',         total: 8 },
        { title: 'Unicorn Fart Clicker', icon: '\uD83E\uDD84', key: 'unicornAch',         total: 9 },
        { title: 'Astro Miner',          icon: '\u26CF\uFE0F', key: 'astroMinerAch',      total: 9 },
        { title: 'Star Fury',            icon: '\uD83C\uDF1F', key: 'starFuryAch',          total: 10 },
        { title: 'Inkognito',            icon: '\uD83C\uDFA8', key: 'inkognitoAch',         total: 8 },
        { title: 'Dress-Up',             icon: '\uD83D\uDC57', key: 'dressUpAch',           total: 10 },
        { title: 'Stack Tower',          icon: '\uD83C\uDFD7\uFE0F', key: 'stackTowerAch',  total: 8 },
        { title: 'Neon Pong',            icon: '\uD83C\uDFD3', key: 'neonPongAch',          total: 8 },
        { title: 'Beat Drop',            icon: '\uD83C\uDFB5', key: 'beatDropAch',          total: 8 },
        { title: 'Rivals',               icon: '\u2694\uFE0F', key: 'rivalsAch',            total: 10 },
        { title: 'Gravity Garden',       icon: '\uD83C\uDF31', key: 'gravityGardenAch',     total: 6 },
        { title: 'Last Seen Online',     icon: '\uD83D\uDCF1', key: 'lastSeenOnlineAch',    total: 6 },
        { title: 'Art of Doing Nothing', icon: '\uD83E\uDDD8', key: 'artOfDoingNothingAch', total: 6 },
        { title: 'HeartServe',           icon: '\uD83D\uDC95', key: 'heartServeAch',        total: 6 },
        { title: 'Signal Lost',          icon: '\uD83D\uDCE1', key: 'signalLostAch',        total: 6 },
      ];
      let totalUnlocked = 0;
      let totalAvailable = 0;
      const achGrid = document.getElementById('achGrid');
      for (const g of achGames) {
        let unlocked = 0;
        totalAvailable += g.total;
        try {
          const raw = JSON.parse(localStorage.getItem(g.key) || '{}');
          if (g.nested) {
            unlocked = Array.isArray(raw[g.nested]) ? raw[g.nested].length : 0;
          } else {
            unlocked = Array.isArray(raw.unlocked) ? raw.unlocked.length : 0;
          }
        } catch(e) {}
        totalUnlocked += unlocked;
        const el = document.createElement('div');
        el.className = 'ach-game';
        el.innerHTML =
          '<span class="ach-game-icon">' + g.icon + '</span>' +
          '<div class="ach-game-info"><h4>' + g.title + '</h4><span>' + unlocked + ' / ' + g.total + '</span></div>' +
          '<span class="ach-game-count">' + (unlocked === g.total ? '\u2705' : unlocked + '/' + g.total) + '</span>';
        achGrid.appendChild(el);
      }
      document.getElementById('achTotal').innerHTML = '<strong>' + totalUnlocked + '</strong> / ' + totalAvailable;
      document.getElementById('achBar').style.width = (totalAvailable > 0 ? (totalUnlocked / totalAvailable * 100) : 0) + '%';

      // i18n
      if (typeof I18N !== 'undefined') {
        I18N.applyDOM();
        window.addEventListener('langchange', () => I18N.applyDOM());
      }
    })();
    </script>
  </body>
</html>
